services:
  db:
      image: postgres:16-alpine
      container_name: postgres_db
      restart: always
      env_file:
        - .env
      environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASS}
        POSTGRES_DB: ${DB_NAME}
      volumes:
        - db-data:/var/lib/postgresql/data
      networks:
        - app-network

  bot:
      build: .
      container_name: tg_bot
      restart: always
      env_file:
        - .env
      depends_on:
        - db
      networks:
        - app-network

  nginx:
      image: nginx:alpine
      container_name: nginx
      restart: always
      ports:
        - "80:80"
        - "443:443"
      volumes:
        - ./nginx.conf:/etc/nginx/nginx.conf
        - ./certbot/conf:/etc/letsencrypt
        - ./certbot/www:/var/www/certbot
      depends_on:
        - bot
      networks:
        - app-network

networks:
  app-network:
      driver: bridge

volumes:
  db-data: