 <!DOCTYPE html>
  <html lang="ru">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Статистика</title>
      <!-- Bootstrap CSS -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
      <!-- Chart.js -->
      <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  </head>
  <body class="bg-light">
      <div class="container py-5">
          <h1 class="mb-4">📊 Статистика бота</h1>

          <!-- Карточки с общей статистикой -->
          <div class="row mb-4">
              <div class="col-md-3">
                  <div class="card text-center">
                      <div class="card-body">
                          <h5 class="card-title text-muted">Всего пользователей</h5>
                          <h2 class="card-text text-primary">{{ total_users }}</h2>
                      </div>
                  </div>
              </div>
              <div class="col-md-3">
                  <div class="card text-center">
                      <div class="card-body">
                          <h5 class="card-title text-muted">Похудение</h5>
                          <h2 class="card-text text-danger">{{ goals.weight_loss }}</h2>
                      </div>
                  </div>
              </div>
              <div class="col-md-3">
                  <div class="card text-center">
                      <div class="card-body">
                          <h5 class="card-title text-muted">Улучшение</h5>
                          <h2 class="card-text text-success">{{ goals.improvement }}</h2>
                      </div>
                  </div>
              </div>
              <div class="col-md-3">
                  <div class="card text-center">
                      <div class="card-body">
                          <h5 class="card-title text-muted">Режим</h5>
                          <h2 class="card-text text-warning">{{ goals.mode }}</h2>
                      </div>
                  </div>
              </div>
          </div>
          <div class="btn-group mb-3" role="group">
            <a href="/admin/stats?period=7" class="btn btn-outline-primary">7 дней</a>
            <a href="/admin/stats?period=30" class="btn btn-outline-primary">30 дней</a>
            <a href="/admin/stats" class="btn btn-outline-primary">Все время</a>
        </div>
          <!-- График регистраций -->
          <div class="card mb-4">
              <div class="card-body">
                  <h5 class="card-title">Регистрации по дням</h5>
                  <canvas id="registrationsChart" style="max-height: 300px;"></canvas>
              </div>
          </div>

          <!-- График целей -->
          <div class="card">
              <div class="card-body">
                  <h5 class="card-title">Распределение по целям</h5>
                  <canvas id="goalsChart" style="max-height: 300px;"></canvas>
              </div>
          </div>
      </div>

      <!-- Передаем данные в JS -->
      <script>
      const statsData = {
          byDates: {{ by_dates | safe }},
          goals: {
              weight_loss: {{ goals.weight_loss }},
              improvement: {{ goals.improvement }},
              mode: {{ goals.mode }}
          }
      };
      </script>
      <!-- Подключаем наш JS -->
      <script src="/admin/static/stats.js"></script>
  </body>
  </html>
